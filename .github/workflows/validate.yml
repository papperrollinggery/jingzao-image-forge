name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Compile Python sources
        run: python3 -m py_compile scripts/reference_delivery.py scripts/validate_spec.py scripts/validate_style_capsule.py scripts/create_style_capsule.py scripts/compile_prompt.py scripts/compile_production.py scripts/prompt_lint.py scripts/validate_forward_tests.py tests/test_skill.py tests/test_production.py

      - name: Lint Python sources
        run: |
          python3 -m pip install ruff==0.16.3
          ruff check scripts tests

      - name: Validate specifications
        run: |
          python3 scripts/validate_spec.py templates/visual-spec.json
          python3 scripts/validate_spec.py examples/atomic-cyber-live-action.json
          python3 scripts/validate_spec.py examples/narrative-film-frame.json
          python3 scripts/validate_spec.py examples/styleboard-3x3.json
          python3 scripts/validate_spec.py examples/ui-motion-storyboard.json
          python3 scripts/validate_spec.py examples/continuous-nine-shot-ferry.json
          python3 scripts/validate_spec.py examples/jingzao-intro-infographic-edit.json
          python3 scripts/validate_spec.py examples/style-learning-graphite-copper.json
          python3 scripts/validate_spec.py examples/tactile-stop-motion-product.json
          python3 scripts/validate_spec.py examples/architecture-exhibition.json
          python3 scripts/validate_spec.py examples/causal-fantasy-effect.json
          python3 scripts/validate_spec.py examples/reconstruct-architecture-reference.json
          python3 scripts/validate_spec.py examples/restyle-risograph-editorial.json
          python3 scripts/validate_spec.py examples/expand-roadside-outpaint.json
          for spec in tests/forward-specs/*.json; do
            python3 scripts/validate_spec.py "$spec"
          done
          python3 scripts/validate_style_capsule.py templates/style-capsule.json
          python3 scripts/validate_style_capsule.py examples/style-capsule-graphite-copper.json
          python3 scripts/validate_style_capsule.py references/style-capsules/crimson-nocturne-wuxia-montage.json
          python3 scripts/validate_forward_tests.py tests/forward-test-manifest.json
          python3 scripts/create_style_capsule.py examples/style-learning-graphite-copper.json --output /tmp/style-capsule.json
          cmp /tmp/style-capsule.json examples/style-capsule-graphite-copper.json
          python3 scripts/reference_delivery.py examples/style-learning-graphite-copper.json > /tmp/reference-local.json
          python3 -m json.tool /tmp/reference-local.json > /dev/null
          python3 scripts/reference_delivery.py examples/styleboard-3x3.json > /tmp/reference-conversation.json
          python3 -m json.tool /tmp/reference-conversation.json > /dev/null
          python3 scripts/reference_delivery.py examples/atomic-cyber-live-action.json > /tmp/reference-runtime-asset.json
          python3 -m json.tool /tmp/reference-runtime-asset.json > /dev/null
          python3 scripts/reference_delivery.py examples/style-learning-graphite-copper.json --target codex_imagegen > /tmp/reference-codex-local.json
          python3 scripts/reference_delivery.py examples/styleboard-3x3.json --target codex_imagegen --confirm-conversation-window > /tmp/reference-codex-conversation.json
          python3 scripts/reference_delivery.py examples/ui-motion-storyboard.json --target codex_imagegen > /tmp/reference-codex-ui-motion.json
          python3 scripts/reference_delivery.py examples/continuous-nine-shot-ferry.json --target codex_imagegen > /tmp/reference-codex-continuous.json
          python3 scripts/reference_delivery.py examples/jingzao-intro-infographic-edit.json --target codex_imagegen > /tmp/reference-codex-intro.json
          if python3 scripts/reference_delivery.py examples/atomic-cyber-live-action.json --target codex_imagegen > /tmp/reference-codex-unresolved.json; then
            echo "Expected unresolved platform asset to fail Codex ImageGen preflight" >&2
            exit 1
          fi

      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate independent production handoff
        run: |
          for platform in openai flux midjourney generic; do
            python3 scripts/compile_production.py examples/production-coverage.json --platform "$platform" > "/tmp/production-$platform.json"
            python3 -m json.tool "/tmp/production-$platform.json" > /dev/null
          done
          python3 scripts/compile_production.py examples/production-coverage.json --platform openai --frame-id frame-02 > /tmp/production-frame-02.json
          python3 -m json.tool /tmp/production-frame-02.json > /dev/null

      - name: Lint canonical compiled prompts
        run: |
          python3 scripts/prompt_lint.py examples/causal-fantasy-effect.json --platform openai --max-words 1800
          python3 scripts/prompt_lint.py examples/narrative-film-frame.json --platform openai --max-words 1200
          python3 scripts/prompt_lint.py examples/tactile-stop-motion-product.json --platform openai --max-words 1100
          python3 scripts/prompt_lint.py examples/continuous-nine-shot-ferry.json --platform openai --max-words 1400
          python3 scripts/prompt_lint.py examples/jingzao-intro-infographic-edit.json --platform openai --max-words 1000
          python3 scripts/prompt_lint.py examples/ui-motion-storyboard.json --platform openai --max-words 1700
          python3 scripts/prompt_lint.py examples/causal-fantasy-effect.json --platform midjourney --approve-review --max-words 1700

      - name: Validate platform compiler JSON
        run: |
          for platform in openai flux midjourney generic; do
            python3 scripts/compile_prompt.py examples/atomic-cyber-live-action.json --platform "$platform" > "/tmp/$platform.json"
            python3 -m json.tool "/tmp/$platform.json" > /dev/null
          done
          python3 scripts/compile_prompt.py examples/narrative-film-frame.json --platform openai > /tmp/narrative-openai.json
          python3 -m json.tool /tmp/narrative-openai.json > /dev/null
          python3 scripts/compile_prompt.py examples/styleboard-3x3.json --platform openai > /tmp/styleboard-openai.json
          python3 -m json.tool /tmp/styleboard-openai.json > /dev/null
          python3 scripts/compile_prompt.py examples/ui-motion-storyboard.json --platform openai > /tmp/ui-motion-openai.json
          python3 -m json.tool /tmp/ui-motion-openai.json > /dev/null
          for spec in continuous-nine-shot-ferry jingzao-intro-infographic-edit; do
            for platform in openai flux midjourney generic; do
              python3 scripts/compile_prompt.py "examples/$spec.json" --platform "$platform" > "/tmp/$spec-$platform.json"
              python3 -m json.tool "/tmp/$spec-$platform.json" > /dev/null
            done
          done
          for platform in openai flux midjourney generic; do
            python3 scripts/compile_prompt.py examples/style-learning-graphite-copper.json --platform "$platform" > "/tmp/style-learning-$platform.json"
            python3 -m json.tool "/tmp/style-learning-$platform.json" > /dev/null
          done
          python3 scripts/compile_prompt.py examples/causal-fantasy-effect.json --platform openai > /tmp/causal-openai.json
          python3 -m json.tool /tmp/causal-openai.json > /dev/null
          for spec in reconstruct-architecture-reference restyle-risograph-editorial expand-roadside-outpaint; do
            python3 scripts/compile_prompt.py "examples/$spec.json" --platform openai > "/tmp/$spec-openai.json"
            python3 -m json.tool "/tmp/$spec-openai.json" > /dev/null
          done
          for platform in openai flux midjourney generic; do
            python3 scripts/compile_prompt.py examples/tactile-stop-motion-product.json --style-capsule examples/style-capsule-graphite-copper.json --platform "$platform" > "/tmp/tactile-$platform.json"
            python3 -m json.tool "/tmp/tactile-$platform.json" > /dev/null
            python3 scripts/compile_prompt.py examples/architecture-exhibition.json --style-capsule examples/style-capsule-graphite-copper.json --platform "$platform" > "/tmp/architecture-$platform.json"
            python3 -m json.tool "/tmp/architecture-$platform.json" > /dev/null
            python3 scripts/compile_prompt.py examples/tactile-stop-motion-product.json --style-capsule references/style-capsules/crimson-nocturne-wuxia-montage.json --platform "$platform" > "/tmp/crimson-$platform.json"
            python3 -m json.tool "/tmp/crimson-$platform.json" > /dev/null
          done
